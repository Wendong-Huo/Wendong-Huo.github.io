<div class="research-grid">
{% for project in site.data.research %}
<article class="research-card">
  <a class="research-image" href="{{ '/portfolio/' | append: project.slug | append: '/' | relative_url }}"><img src="{{ '/images/research/' | append: project.image | relative_url }}" alt="{{ project.alt }}" width="960" height="600" loading="lazy" decoding="async"></a>
  <div class="research-card-body"><p class="eyebrow">{{ project.year }} · RESEARCH</p><h3><a href="{{ '/portfolio/' | append: project.slug | append: '/' | relative_url }}">{{ project.title }}</a></h3><p>{{ project.summary }}</p><a class="text-link" href="{{ '/portfolio/' | append: project.slug | append: '/' | relative_url }}">View study →</a></div>
</article>
{% endfor %}
</div>
